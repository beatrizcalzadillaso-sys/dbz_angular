

<h1>Dragon Ball Z</h1>
    <hr>
    <div class="rom">
      <div class="col">
        <h3>Personajes</h3>
        <hr>
        <ul>
          @for (personaje of personajes; track $index) {
            <li>{{personaje.nombre}} - {{personaje.poder}}</li>
          }
        </ul>
      </div>
    </div>



    <form (ngSubmit)="agregar()">
    <input type="text" placeholder="Nombre" name="nombre" [(ngModel)]="nuevo.nombre"/>
    <br><br>
    <input type="number" placeholder="Poder" name="poder" [(ngModel)]="nuevo.poder"/>
    <br><br>
    <button type="submit"> Agregar </button>
</form>
